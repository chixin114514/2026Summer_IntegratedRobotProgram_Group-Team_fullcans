# ============================================================
# Fixed-point pick-and-place task configuration
#
# Coordinates are expressed relative to the robot base frame.
# ============================================================

home:

  joints_deg:
    - 0.0
    - -20.0
    - -70.0
    - 0.0
    - 90.0
    - 0.0


point_a:

  x: 0.180

  y: 0.100

  z: 0.040


point_b:

  x: 0.180

  y: -0.100

  z: 0.040


safe_height:

  z: 0.110


motion:

  simulation_speed_scale:
    0.40

  real_speed_scale:
    0.20

  home_duration_s:
    4.0

  approach_duration_s:
    4.0

  descend_duration_s:
    3.0

  lift_duration_s:
    3.5

  transfer_duration_s:
    5.0


gripper:

  open_position:
    0.000

  closed_position:
    0.008

  close_duration_s:
    1.5

  open_duration_s:
    1.5


experiment:

  total_trials:
    5

  required_successes:
    4
