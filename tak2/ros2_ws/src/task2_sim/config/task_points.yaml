# ============================================================
# Fixed-point pick-and-place task configuration
#
# Coordinates are expressed relative to the robot base frame.
# ============================================================

home:

  joints_deg:
    - 0.0
    - -20.0
    - -70.0
    - 0.0
    - 90.0
    - 0.0


point_a:

  x: 0.180

  y: 0.100

  z: 0.040


point_b:

  x: 0.180

  y: -0.100

  z: 0.040


safe_height:

  z: 0.110


motion:

  simulation_speed_scale:
    0.40

  real_speed_scale:
    0.20

  home_duration_s:
    4.0

  approach_duration_s:
    4.0

  descend_duration_s:
    3.0

  lift_duration_s:
    3.5

  transfer_duration_s:
    5.0


gripper:

  open_position:
    0.000

  closed_position:
    0.008

  close_duration_s:
    1.5

  open_duration_s:
    1.5


experiment:

  total_trials:
    5

  required_successes:
    4


# ============================================================
# Kinematics / IK configuration
#
# These parameters are explicit so the task can be calibrated
# without rewriting task_manager.py.
# ============================================================

kinematics:

  # Tool centre point offset from the final wrist frame.
  tool_offset_m:
    0.045

  # Calibrated seed close to point A.
  #
  # This was obtained using the interactive tuning panel.
  pick_seed_deg:
    - 25.0
    - 54.0
    - -13.0
    - 33.0
    - 29.0
    - 88.0

  # Initial seed for the B side.
  place_seed_deg:
    - -25.0
    - 54.0
    - -13.0
    - 33.0
    - 29.0
    - 88.0

  solver:

    maximum_iterations:
      400

    numerical_step_rad:
      0.001

    damping:
      0.03

    maximum_iteration_step_rad:
      0.08
