mode: 2
robot:
  name: mecharm_270_pi
  dof: 6
  base_frame: base
  tool_frame: gripper_palm
gripper:
  type: mycobot_gripper_ag
  enabled: true
simulation:
  enabled_when_mode: 0
  world_name: task2_world
  robot_entity_name: mecharm_270
  target_entity_name: target_object
real:
  enabled_when_mode: [1, 2]
  robot_model: mecharm_270_pi
  serial_device: /dev/ttyUSB0
  baudrate: 115200
  timeout_s: 1.0
  low_speed_mode: true
  driver_type: pymycobot_socket
  robot_ip: 192.168.31.247
  robot_port: 9000
  arm_speed_percent: 10
  gripper_speed_percent: 20
  feedback_period_s: 0.25

  # Formal real-robot acceptance mode is one complete target at a time.
  # The next target is not allowed until fresh MEASURED JointState feedback
  # confirms the previous target has physically arrived.
  queued_execution: true

  # Gripper remains time-based because no physical gripper position feedback
  # is available in the current hardware chain.
  gripper_settle_s: 0.50

  # Real joint feedback closure. All angles are joint-space tolerances and do
  # not change the calibrated A/B/HOME waypoint values.
  real_joint_goal_tolerance_deg: 2.0
  real_home_tolerance_deg: 1.5
  real_goal_stable_s: 0.50
  real_motion_timeout_s: 20.0
  real_feedback_max_age_s: 3.0
  real_goal_log_period_s: 1.0

  # RESET_HOME recovery.
  # Retry the identical HOME target only when fresh measured
  # feedback shows that the robot has made no meaningful
  # progress for several seconds.
  real_home_retry_interval_s: 3.0
  real_home_progress_epsilon_deg: 0.30
  real_home_max_retries: 3
