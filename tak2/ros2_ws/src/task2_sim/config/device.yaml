mode: 1
robot:
  name: mecharm_270_pi
  dof: 6
  base_frame: base
  tool_frame: gripper_palm
gripper:
  type: mycobot_gripper_ag
  enabled: true
simulation:
  enabled_when_mode: 0
  world_name: task2_world
  robot_entity_name: mecharm_270
  target_entity_name: target_object
real:
  enabled_when_mode: 1
  robot_model: mecharm_270_pi
  serial_device: /dev/ttyUSB0
  baudrate: 115200
  timeout_s: 1.0
  low_speed_mode: true
  driver_type: pymycobot_socket
  robot_ip: 10.238.238.133
  robot_port: 9000
  arm_speed_percent: 20
  gripper_speed_percent: 20
  command_period_s: 0.10
  feedback_period_s: 0.15
  # Real hardware state synchronisation.
  # A motion state cannot finish until measured joints
  # actually reach the target.
  goal_tolerance_deg: 3.0
  goal_required_samples: 2
  # Real-motion convergence watchdog.
  #
  # Keep waiting while measured error is improving.
  # Stop only if the robot stops making progress.
  goal_stall_timeout_s: 5.0
  goal_absolute_timeout_s: 30.0
  goal_progress_epsilon_deg: 0.25

  # Re-send an unchanged final target occasionally.
  # This is slow enough not to create a command queue.
  final_command_resend_s: 0.80
