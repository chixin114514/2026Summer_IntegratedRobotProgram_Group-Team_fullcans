joint_limits_deg:
  # Existing project limits are intentionally retained. Before physical
  # acceptance, verify them against the exact MechArm 270 Pi firmware/model
  # in use; this patch does not silently recalibrate hardware limits.
  joint1:
    min: -160.0
    max: 160.0
  joint2:
    min: -75.0
    max: 120.0
  joint3:
    min: -175.0
    max: 65.0
  joint4:
    min: -155.0
    max: 155.0
  joint5:
    min: -115.0
    max: 115.0
  joint6:
    min: -180.0
    max: 180.0
cartesian:
  minimum_table_clearance_m: 0.015
  maximum_position_error_m: 0.015
  ik_position_tolerance_m: 0.005
  ik_orientation_tolerance_deg: 3.0
motion:
  # Final acceptance must latch software faults instead of logging and
  # continuing the state machine.
  software_safety_enabled: true
  real_low_speed_required: true

  # Simulation still uses interpolated commands and therefore keeps its
  # per-command step check. In formal real queued mode the complete target
  # can legitimately differ by more than 3 degrees; firmware interpolates
  # the physical motion and safety is enforced by hard limits, fresh measured
  # feedback, goal tolerances, feedback timeout and motion timeout.
  maximum_joint_step_deg_simulation: 6.5
  maximum_joint_step_deg_real: 3.0
failure_policy:
  unreachable_target: safe_stop
  ik_failure: safe_stop
  joint_limit: safe_stop
  communication_failure: safe_stop
  grasp_failure: return_home
