robot:
  ip: "192.168.50.2"
  port: 9000
  arm_speed: 25
  gripper_speed: 100
  gripper_settle_s: 0.8
  # 纯开环：发送关节命令后固定等待0.8秒，不读取任何关节反馈。
  command_interval_s: 0.8
  # MechArm 270 Pi 六关节配置范围。
  # 实测 P5 的 J1 为 163.47°，因此此处按实测范围放宽到 ±165°。
  joint_min_deg: [-165.0, -75.0, -175.0, -155.0, -115.0, -180.0]
  joint_max_deg: [165.0, 120.0, 65.0, 155.0, 115.0, 180.0]

vision:
  topic: "/yolo/detections"
  min_confidence: 0.70
  history_frames: 9
  required_votes: 5
  # 0 表示开始运动前的初始识别无限等待，不因暂时看不清而结束。
  classification_timeout_s: 0

# 类别名必须与 YOLO JSON 中的 class_name 完全一致。
class_routes:
  stapler_box: bin_1
  charger: bin_2

# 初始识别完成后的固定转场姿态。开始运动后摄像头结果不再使用。
