robot:
  ip: "192.168.77.2"
  port: 9000
  arm_speed: 25
  gripper_speed: 100
  # 每发送一条移动或夹爪命令后，等待这段时间再发送下一条指令。
  next_command_delay_s: 5
  # MechArm 270 Pi 六关节配置范围。
  # 实测 P5 的 J1 为 163.47°，因此此处按实测范围放宽到 ±165°。
  joint_min_deg: [-200.0, -200.0, -200.0, -200.0, -200.0, -200.0]
  joint_max_deg: [200.0, 200.0, 200.0, 200.0, 200.0, 200.0]

vision:
  topic: "/yolo/detections"
  min_confidence: 0.70
  history_frames: 9
  required_votes: 5
  # 0 表示开始运动前的初始识别无限等待，不因暂时看不清而结束。
  classification_timeout_s: 0

# 类别名必须与 YOLO JSON 中的 class_name 完全一致。
class_routes:
  stapler_box: bin_1
  charger_plug: bin_2

# 初始识别完成后的固定转场姿态。开始运动后摄像头结果不再使用。
inspection_home_angles: [-21.0, -136.7, 153.1, 176.53, 4.94, -90.17] 

# 所有关节角顺序均为 [J1, J2, J3, J4, J5, J6]，单位为度。
stations:
  - name: P1
    approach_angles: [159.1, -88.3, 146.7, -165.42, -15.97, -47.0]
    pick_angles: [161.4, -91.4, 90.6, -165.0, -19.73, -48.61]
    retreat_angles: [159.1, -88.3, 146.7, -165.42, -15.97, -47.0]
  - name: P2
    approach_angles: [146.3, 31.4, 140.6, -167.4, -10.62, -1.16]
    pick_angles: [170.4, 30.4, 83.6, -166.92, -9.13, -5.65]
    retreat_angles: [146.3, 31.4, 140.6, -167.4, -10.62, -1.16]
  - name: P3
    approach_angles: [141.9, 99.6, 133.0, -159.24, -18.56, 16.07]
    pick_angles: [152.7, 99.0, 86.5, -155.24, -21.51, -5.76]
    retreat_angles: [141.9, 99.6, 133.0, -159.24, -18.56, 16.07]
  - name: P4
    approach_angles: [-156.2, -14.4, 140.5, -166.91, -14.3, -157.2]
    pick_angles: [-156.2, -114.4, 92.5, -166.91, -14.3, -157.2]
    retreat_angles: [-156.2, -14.4, 140.5, -166.91, -14.3, -157.2]
  - name: P5
    approach_angles: [18.2, 192.8, 134.0, -167.57, -12.1, 71.57]
    pick_angles: [18.2, 192.8, 90.0, -167.57, -12.1, 71.57]
    retreat_angles: [18.2, 192.8, 134.0, -167.57, -12.1, 71.57]
  - name: P6
    approach_angles: [-171.7, 88.5, 129.0, -168.22, -10.19, 140.05]
    pick_angles: [-170.8, 87.0, 86.0, -168.19, -8.39, 139.85]
    retreat_angles: [-171.7, 88.5, 129.0, -168.22, -10.19, 140.05]

# 每个 bin 只有一个固定投放点；同一 bin 的 3 个物块都会重复使用该点。
bins:
  bin_1:
    label: "BinA固定投放点-订书机盒子"
    expected_count: 3
    drop_point:
      approach_angles: [37.0, -189.1, 141.0, -167.83, -13.19, -89.7]
      place_angles: [37.0, -189.1, 141.0, -167.83, -13.19, -89.7]
      retreat_angles: [37.0, -189.1, 141.0, -167.83, -13.19, -89.7]
  bin_2:
    label: "BinB固定投放点-充电器"
    expected_count: 3
    drop_point:
      approach_angles: [-181.0, -66.7, 141.0, -168.31, -13.52, -170.44]
      place_angles: [-181.0, -66.7, 141.0, -168.31, -13.52, -170.44]
